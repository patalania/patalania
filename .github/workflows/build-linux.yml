name: Build Patalania Linux

# Nur manuell oder per Versions-Tag (v*). Kein Build bei normalen Pushes.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  CC: gcc-14
  CXX: g++-14

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout Patalania (full history for build number)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ninja

      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            gcc-14 g++-14 cmake libssl-dev \
            build-essential python3-setuptools \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxinerama-dev libxrandr-dev libpulse-dev \
            libfreetype6-dev libfontconfig1-dev \
            wget apt-transport-https software-properties-common

      - name: Install PowerShell (required by autobuild)
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" \
            -O packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Compute version
        id: version
        run: |
          base="$(tr -d '[:space:]' < indra/newview/VIEWER_VERSION_FS.txt)"
          build="$(git rev-list --count HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "full=$base.$build" >> "$GITHUB_OUTPUT"
          # CMake (BuildVersion.cmake) uses env 'revision' as fourth number,
          # no autobuild timestamp.
          echo "revision=$build" >> "$GITHUB_ENV"
          echo "Patalania version: $base.$build"

      - name: Configure
        run: |
          autobuild configure -A 64 -c ReleaseOS -- \
            -DVIEWER_CHANNEL:STRING=Patalania-Release \
            -DVIEWER_BINARY_NAME:STRING=patalania-bin \
            -DROOT_PROJECT_NAME:STRING=Patalania \
            -DLL_TESTS:BOOL=FALSE \
            -DUSE_FMODSTUDIO:BOOL=OFF \
            -DUSE_KDU:BOOL=OFF \
            -DOPENSIM:BOOL=ON \
            -DHAVOK_TPV:BOOL=OFF \
            -DPATALANIA_XR:BOOL=ON

      - name: Build
        run: autobuild build -A 64 -c ReleaseOS --no-configure

      - name: Collect package
        id: pkg
        run: |
          ls -la build-linux-*/newview/*.tar.xz
          mkdir -p out
          cp build-linux-*/newview/*.tar.xz out/
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patalania-linux-${{ steps.version.outputs.full }}
          path: out/*.tar.xz
          retention-days: 14
          if-no-files-found: error

      - name: Create draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.full }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          # <PAT:Release> Quoted heredoc: backticks stay literal; placeholders are replaced below.
          cat > release-notes.md <<'NOTES'
          # Patalania @VERSION@ (Linux x86_64)

          Patalania is a viewer for Second Life and OpenSim grids with native OpenXR virtual reality support. It is based on Firestorm @BASE@ and on the Second Life viewer by Linden Lab.

          **This software is not provided or supported by Linden Lab, the makers of Second Life.** Second Life is a trademark of Linden Research, Inc. Patalania is an independent third-party viewer; it is not affiliated with, endorsed by or sponsored by Linden Research, nor by The Phoenix Firestorm Project, Inc.

          **No support.** Patalania is a hobby project provided as is, without warranty and without any support. You may report bugs on the [issue tracker](https://github.com/@REPO@/issues), but there is no guarantee of an answer or a fix. See [SUPPORT.md](https://github.com/@REPO@/blob/@TAG@/SUPPORT.md).

          ## VR features

          - Native VR view through OpenXR, tested with WiVRn and a Meta Quest 3
          - Keyboard and mouse control, no hand controllers needed
          - Passthrough windows around your hands and keyboard, so you can see your real keyboard while wearing the headset
          - The complete viewer UI (menus, chat, inventory, HUDs) on a virtual screen in front of you, usable with the mouse
          - VR settings page (Preferences → VR)
          - Falls back to a normal desktop viewer if no OpenXR runtime or headset is found

          ## System requirements

          - Linux x86_64 (built on Ubuntu 24.04) with an OpenGL 3.3+ capable GPU and current drivers
          - For VR: an OpenXR runtime with OpenGL support, e.g. WiVRn, and a headset such as the Meta Quest 3
          - A broadband internet connection

          ## Installation

          1. Download the `.tar.xz` archive below and extract it.
          2. Run `./install.sh` inside the extracted folder. It installs to `~/.local/opt/patalania` as a normal user (or `/opt/patalania` with sudo) and adds a "Patalania" start menu entry.
          3. Alternatively, run `./patalania` directly from the extracted folder.

          ## Quick start (VR)

          1. Extract the archive and run `./install.sh` (adds "Patalania" to the start menu).
          2. Install WiVRn on the PC (Flatpak `io.github.wivrn.wivrn`) and start the WiVRn server. Install the WiVRn app on the headset. Follow the official WiVRn instructions: <https://github.com/WiVRn/WiVRn>
          3. Open the WiVRn app on the headset and connect to your PC.
          4. Start Patalania, log in, and press **Ctrl+Shift+V** to enter VR.
          5. Most important keys:
             - **Ctrl+Shift+V**, or hold **Esc** for about 1.5 seconds: leave VR
             - **Ctrl+Shift+Space**: show/hide the UI (hold it to bring the UI in front of you)
             - Put both hands on the keyboard for about 1 second: places the keyboard window
             - **M**: mouselook; **Alt+click**: focus camera
             - More settings: Preferences → VR
          6. Tips:
             - Put the controllers down so that hand tracking is used.
             - WiVRn must run on your real GPU: check the WiVRn server log for the GPU name (it should not say "llvmpipe").
             - The desktop FPS limit does not apply in VR. Use "Half frame rate" in Preferences → VR if your PC struggles.

          ## Important information

          - [Privacy policy (PRIVACY.md)](https://github.com/@REPO@/blob/@TAG@/PRIVACY.md)
          - [Support information (SUPPORT.md)](https://github.com/@REPO@/blob/@TAG@/SUPPORT.md)
          - [Known limitations (docs/KNOWN_LIMITATIONS.md)](https://github.com/@REPO@/blob/@TAG@/docs/KNOWN_LIMITATIONS.md)

          Source code: <https://github.com/@REPO@> (LGPL, see the repository for licenses and credits).
          NOTES
          sed -i 's/^          //' release-notes.md
          sed -i -e "s|@VERSION@|${VERSION}|g" -e "s|@BASE@|${BASE}|g" \
                 -e "s|@REPO@|${GITHUB_REPOSITORY}|g" -e "s|@TAG@|${GITHUB_REF_NAME}|g" release-notes.md
          gh release create "$GITHUB_REF_NAME" out/*.tar.xz \
            --draft \
            --title "Patalania ${VERSION}" \
            --notes-file release-notes.md
