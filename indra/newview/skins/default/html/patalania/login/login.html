<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Patalania</title>
<!-- <PAT:Phase3> Local login page shipped with the viewer (replaces the Firestorm web login page).
     No external resources, no scripts that talk to a server. Version and channel are passed by
     the viewer as query parameters (?version=...&channel=...&lang=...) and only displayed here. </PAT> -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #2b2f36;
    color: #e6e9ee;
    font-family: "DejaVu Sans", "Noto Sans", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .logo { width: 128px; height: 128px; }
  h1 { font-size: 36px; font-weight: 600; margin: 18px 0 6px 0; letter-spacing: 1px; }
  .sub { color: #aab2bf; font-size: 14px; margin: 0 0 22px 0; }
  .ver { color: #8a93a1; font-size: 13px; }
</style>
</head>
<body>
<div>
<svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8cf0"/><stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fe8"/><stop offset="1" stop-color="#7cc2ff"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdc3c"/><stop offset="1" stop-color="#3f9a1f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa82a"/><stop offset="1" stop-color="#2f7d1c"/>
    </linearGradient>
    <clipPath id="bowl"><circle cx="276" cy="210" r="104"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="150" y="106" width="36" height="300" rx="18" fill="#f4f6ff"/>
  <g clip-path="url(#bowl)">
    <rect x="160" y="100" width="240" height="230" fill="url(#sky)"/>
    <!-- Wolken -->
    <g fill="#ffffff">
      <circle cx="222" cy="160" r="15"/><circle cx="242" cy="152" r="19"/><circle cx="262" cy="161" r="13"/>
      <rect x="208" y="160" width="68" height="14" rx="7"/>
      <circle cx="318" cy="186" r="11"/><circle cx="333" cy="180" r="14"/><circle cx="348" cy="188" r="9"/>
      <rect x="307" y="186" width="50" height="10" rx="5"/>
    </g>
    <!-- Hügel -->
    <path d="M150 250 Q230 196 330 222 Q370 232 410 252 V340 H150 Z" fill="url(#hill)"/>
    <path d="M226 214 Q270 206 310 220" stroke="#b6f06a" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    <!-- Vordere Wiese -->
    <path d="M150 284 Q270 266 410 276 V340 H150 Z" fill="url(#field)"/>
    <g fill="#ffe14d"><circle cx="214" cy="296" r="3"/><circle cx="252" cy="290" r="3"/><circle cx="296" cy="298" r="3"/><circle cx="330" cy="289" r="3"/></g>
  </g>
  <circle cx="276" cy="210" r="104" fill="none" stroke="#f4f6ff" stroke-width="22"/>
</svg>

<h1>Patalania</h1>
<p class="sub" id="sub">A viewer for the Second Life&reg; world and OpenSim</p>
<div class="ver" id="ver"></div>
</div>
<script>
(function () {
  var q = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var p = kv.split("=");
    try { q[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || "").replace(/\+/g, " ")); } catch (e) {}
  });
  if ((q.lang || "").toLowerCase().indexOf("de") === 0) {
    document.getElementById("sub").textContent = "Ein Viewer f\u00fcr die Second Life\u00ae-Welt und OpenSim";
  }
  var v = [];
  if (q.version) v.push("Version " + q.version);
  if (q.channel) v.push(q.channel);
  document.getElementById("ver").textContent = v.join(" \u2013 ");
})();
</script>
</body>
</html>
